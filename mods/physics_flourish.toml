api_version = 1
kind = "script"
name = "物理余韵"
source = "mods/scripts/physics_flourish.gd"
events = ["grab.request", "grab.release", "impact", "tick"]
doc = """
给物理加一点情绪：扔出去的东西会发烫，砸到东西会闪一下，几拍之后恢复原色。

这个 mod 的存在意义不是好玩，是**证明行为开放真的通了**：
它同时用到了钩子的四种能力 ——

  grab.request  返回值改变引擎行为（把持握距离从 2.3 改到 1.9）
  grab.release  读事件参数（只有扔得够快才生效，放下不动）
  impact        读引擎采样出来的速度（上一物理帧，不是撞完的残余）
  tick          证明固定节拍真的在跑，且能自己攒状态（倒计时）

它还调了 api.tint / api.reset_tint —— 说明 mod 能改变世界的样子，
而拿不到任何节点、任何 Transform3D。接口只有动词。

想关掉它：把 events 删掉，或者删掉这个文件再跑 ./check.sh。
"""
