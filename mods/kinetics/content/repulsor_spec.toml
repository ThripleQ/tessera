  { name = "cooldown", type = "float", default = 1.0, min = 0.25, max = 5.0, doc = "两次脉冲之间的秒数" },
  { name = "remaining", type = "float", default = 0.0, min = 0.0, max = 5.0, doc = "剩余冷却，运行时可写" },
