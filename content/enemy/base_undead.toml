api_version = 1
kind = "archetype"
id = "enemy/base_undead"
name = "亡灵（基类）"
doc = "所有亡灵的公共模板。它本身不会被摆进世界，只作为 extends 的起点。"
tags = ["undead"]
# 不再靠 doc 里那句"它本身不会被摆进世界"来说服人 —— 那是给读者看的，
# 引擎不读。abstract = true 是给引擎看的：它不进生成菜单，也不能被 spawner 指向。
# 注意它**不继承**：骨行者和墓影各自都是具体内容。
abstract = true

[components.model]
mesh = "humanoid_lowpoly"
palette = "bone"

[components.health]
max = 30
regen = 0.0

[components.move]
speed = 1.2
wander = 2.0

[components.ai]
brain = "patrol"
aggro_radius = 8.0
leash = 30.0

[components.collider]
shape = "capsule"
size = 0.6
# 亡灵是**刚体**，不是钉住的障碍。所以它能被抓起来、能被扔出去、
# 能被箱子砸倒 —— 抓/放/堆/扔对怪和对木箱是同一套手感，这是故意的。
# 在此之前它写的是"没有 dynamic"，于是菜单里的骨行者放下去是个雕像，
# 名字看着像怪、实际是摆设。`dynamic` 是数据的判断，不是名字的判断（铁律 2）。
dynamic = true
