# 靶子就是真正的敌人，不是另一种东西。
#
# 理由：假靶子只能验证「射线能打到」，验证不了「打中之后它会疼、会死、会掉」。
# 会走过来的骷髅同时是靶子和威胁 —— 它逼你退、逼你压枪，这才叫训练场。
[components.spawner]
archetype = "enemy/bone_walker"
